[package]
name = "cxwatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Audit stale session context and unused configuration for AI coding agents"
license = "MIT"
repository = "https://github.com/aalises/dalekohled"
homepage = "https://github.com/aalises/dalekohled"
readme = "README.md"
exclude = [".github", "demo.mp4", "demo.tape"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tiktoken-rs = "0.12.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
